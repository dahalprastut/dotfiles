
#set prefix key
set -g prefix M-s
unbind C-b
bind-key M-s send-prefix


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


#set General
set -g set-clipboard on #Use system clipboard
set -g status-interval  3 #Update the status bar every 3 seconds
set -g detach-on-destroy off #Don't exit from tmux when closing a session
set -g mouse on

#refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Split horizontally with \

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

#Split vertically with -

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

#New window in the same directory
bind c new-window -c "#{pane_current_path}"

# Use vim arrow keys to resize

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5
bind -r m resize-pane -Z #Use m key to maximize the pane

# Enable vi mode to allow vim movements

set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection

#copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

#Don't exit copy mode when dragging with mouse

unbind -T copy-mode-vi MouseDragEnd1Pane

#Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on #automatically renumber windows when one is closed

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info

# Style (Nordic palette, matches nvim's nordic.nvim theme)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

bg="#242933"          # nordic bg (gray0)
bg_dark="#191D24"     # black0
fg="#C0C8D8"          # white0 (reduced blue)
fg_bright="#ECEFF4"   # white3
gray="#4C566A"        # gray4
gray_dark="#3B4252"   # gray2
gray_sel="#434C5E"    # gray3 (nvim Visual bg)
comment="#7B88A1"     # nvim Comment/LineNr
green="#A3BE8C"
blue="#81A1C1"
cyan="#88C0D0"
yellow="#EBCB8B"
orange="#D08770"

set -g status-justify centre
set -g status-position bottom
set -g status-left-length 100
set -g status-style "fg=${fg},bg=${bg}"
set -g window-style "fg=${fg},bg=${bg}"          # pane bg = nvim bg (instead of terminal black)
set -g window-active-style "fg=${fg},bg=${bg}"
set -g status-left "#[fg=${green},bold] #S #[fg=${comment},nobold] | "
set -g status-right "#[fg=${blue},bold]CPU#[fg=${fg},nobold] #{cpu -i 3}  #[fg=${green},bold]RAM#[fg=${fg},nobold] #{mem}  #[fg=${yellow},bold]DISK#[fg=${fg},nobold] #{disk -f}  #[fg=${comment},bold]BAT#[nobold] #{battery} "
set -g window-status-current-format "#[fg=${cyan},bold] #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag,#[fg=${yellow}] [Z],}"
set -g window-status-format "#[fg=${comment}] #I:#W"
set -g message-style "fg=${fg_bright},bg=${gray_dark}"
set -g message-command-style "fg=${yellow},bg=${gray_dark}"
set -g mode-style "fg=${fg_bright},bg=${gray_sel}"
set -g pane-border-style "fg=${gray}"
set -g pane-active-border-style "fg=${cyan}"
set -g display-panes-colour "${gray}"
set -g display-panes-active-colour "${orange}"
set -g clock-mode-colour "${cyan}"
set -g copy-mode-match-style "fg=${bg_dark},bg=${yellow}"
set -g copy-mode-current-match-style "fg=${bg_dark},bg=${orange}"

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
